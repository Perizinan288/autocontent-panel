[project]
name = "autocontent-panel"
version = "1.0.0"
description = "Auto Content Creator & Uploader Panel for YouTube, Instagram, Facebook"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "google-api-python-client>=2.154.0",
    "google-auth-oauthlib>=1.2.1",
    "apscheduler>=3.10.4",
    "openai>=1.55.0",
    "jinja2>=3.1.4",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "Pillow>=11.0.0",
    "moviepy>=2.1.1",
    "ruff>=0.8.0",
]

[project.scripts]
autocontent = "app.main:run"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
